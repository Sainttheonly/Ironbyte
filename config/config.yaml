mode: enforce

thresholds:
  window_seconds: 1
  distinct_files: 50
  bytes: 5242880

cooldown_seconds: 30
cooldown_scope: comm

log_format: json
log_level: info

allowlist:
  - rsync
  - tar
  - dpkg
  - apt
  - apt-get
  - ironbyte-guard

exclude_dirs:
  - /var/log/
  - /tmp/
  - /var/tmp/
  - /proc/
  - /sys/
